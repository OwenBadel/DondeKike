<ion-content class="login-content" [scrollY]="false">
  <div class="login-container">
    <div class="login-header">
      <img src="assets/media/logo.jpeg" alt="Donde Kike" class="logo-img" />
      <h1>Donde Kike</h1>
    </div>

    <!-- Campo de usuario -->
    <div class="username-section">
      <ion-item lines="none" class="username-item">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input
          [(ngModel)]="username"
          type="text"
          placeholder="Nombre de usuario"
          autocapitalize="off"
          autocomplete="off"
          (ionFocus)="showError = false">
        </ion-input>
      </ion-item>
    </div>

    <!-- PIN dots -->
    <div class="pin-section">
      <p class="pin-label">Ingresa tu PIN</p>
      <div class="pin-dots">
        <div *ngFor="let dot of pinDots" class="dot" [class.filled]="dot"></div>
      </div>
    </div>

    <!-- Error -->
    <div class="error-box" *ngIf="showError">
      <ion-icon name="alert-circle-outline"></ion-icon>
      {{ errorMessage }}
    </div>

    <!-- Teclado numérico -->
    <div class="numpad">
      <div class="numpad-row" *ngFor="let row of numpadKeys">
        <button
          *ngFor="let key of row"
          class="numpad-key"
          [class.empty]="key === ''"
          [class.del-key]="key === 'del'"
          [disabled]="key === '' || isLoading"
          (click)="onKeyPress(key)">
          <ion-icon *ngIf="key === 'del'" name="backspace-outline"></ion-icon>
          <span *ngIf="key !== 'del'">{{ key }}</span>
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div class="loading-indicator" *ngIf="isLoading">
      <ion-spinner name="crescent" color="light"></ion-spinner>
    </div>
  </div>
</ion-content>
