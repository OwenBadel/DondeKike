<ion-content class="login-content" [scrollY]="true">
  <div class="login-shell">
    <div class="login-card">
      <div class="brand-header">
        <div class="logo-ring">
          <img src="assets/media/logo.jpeg" alt="Donde Kike — La esquina del sabor" class="logo-img" />
        </div>
        <h1>Donde Kike</h1>
        <p class="tagline">La esquina del sabor · Punto de Venta</p>
      </div>

      <!-- Usuario -->
      <div class="field-block">
        <label class="field-label" for="login-username">Usuario</label>
        <div class="input-wrapper">
          <ion-icon name="person-outline"></ion-icon>
          <ion-input
            id="login-username"
            [(ngModel)]="username"
            type="text"
            placeholder="Ej: Admin, Mesero..."
            autocapitalize="off"
            autocomplete="username"
            enterkeyhint="next"
            (ionFocus)="showError = false">
          </ion-input>
        </div>
      </div>

      <!-- Indicador PIN -->
      <div class="pin-block">
        <span class="field-label">PIN de acceso (4 dígitos)</span>
        <div class="pin-dots" [class.shake]="shakeDots" aria-label="Indicador de dígitos del PIN">
          <div *ngFor="let dot of pinDots" class="dot" [class.filled]="dot"></div>
        </div>
      </div>

      <!-- Error -->
      <div class="error-banner" *ngIf="showError" role="alert">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Teclado numérico táctil -->
      <div class="numpad" role="group" aria-label="Teclado numérico de PIN">
        <div class="numpad-row" *ngFor="let row of numpadKeys">
          <button
            *ngFor="let key of row"
            type="button"
            class="numpad-key"
            [class.util-key]="key === 'del' || key === 'clear'"
            [disabled]="isLoading"
            [attr.aria-label]="key === 'del' ? 'Borrar dígito' : key === 'clear' ? 'Limpiar PIN' : 'Dígito ' + key"
            (click)="onKeyPress(key)">
            <ion-icon *ngIf="key === 'del'" name="backspace-outline"></ion-icon>
            <span *ngIf="key === 'clear'" class="clear-text">C</span>
            <span *ngIf="key !== 'del' && key !== 'clear'" class="dk-mono">{{ key }}</span>
          </button>
        </div>
      </div>

      <div class="loading-bar" *ngIf="isLoading">
        <ion-spinner name="crescent" color="primary"></ion-spinner>
        <span>Verificando acceso...</span>
      </div>
    </div>
  </div>
</ion-content>
