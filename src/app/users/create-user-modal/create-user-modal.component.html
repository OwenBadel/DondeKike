<ion-header class="ion-no-border">
  <ion-toolbar class="dk-modal-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" aria-label="Cerrar">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nuevo Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="onRegister()"
        [strong]="true"
        color="primary"
        [disabled]="registerForm.invalid || pin.length !== 4 || isSubmitting">
        Crear
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content">
  <form [formGroup]="registerForm" class="register-form">

    <ion-item lines="none" class="dk-form-item">
      <ion-label position="stacked">Nombre completo *</ion-label>
      <ion-input formControlName="fullName" placeholder="Ej: Camilo Pérez"></ion-input>
    </ion-item>
    <div class="dk-field-error" *ngIf="getError('fullName')">{{ getError('fullName') }}</div>

    <ion-item lines="none" class="dk-form-item">
      <ion-label position="stacked">Nombre de usuario *</ion-label>
      <ion-input formControlName="username" placeholder="Ej: camilo" autocapitalize="off"></ion-input>
    </ion-item>
    <div class="dk-field-error" *ngIf="getError('username')">{{ getError('username') }}</div>

    <ion-item lines="none" class="dk-form-item">
      <ion-label position="stacked">Rol operativo *</ion-label>
      <ion-select
        formControlName="role"
        placeholder="Seleccionar rol"
        interface="action-sheet"
        [interfaceOptions]="{ header: 'Seleccionar Rol', cssClass: 'role-action-sheet' }">
        <ion-select-option *ngFor="let role of roles" [value]="role.value">
          {{ role.label }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <div class="pin-block">
      <span class="pin-label">PIN de acceso (4 dígitos)</span>
      <div class="pin-dots">
        <div *ngFor="let dot of pinDots" class="dot" [class.filled]="dot"></div>
      </div>
    </div>

    <div class="numpad">
      <div class="numpad-row" *ngFor="let row of numpadKeys">
        <button
          *ngFor="let key of row"
          type="button"
          class="numpad-key"
          [class.util]="key === 'del' || key === 'clear'"
          [disabled]="isSubmitting"
          (click)="onKeyPress(key)">
          <ion-icon *ngIf="key === 'del'" name="backspace-outline"></ion-icon>
          <span *ngIf="key === 'clear'">C</span>
          <span *ngIf="key !== 'del' && key !== 'clear'" class="dk-mono">{{ key }}</span>
        </button>
      </div>
    </div>

  </form>
</ion-content>
