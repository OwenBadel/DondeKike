<ion-header class="ion-no-border">
  <ion-toolbar class="dk-modal-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" aria-label="Cerrar">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ mode === 'create' ? 'Nuevo Insumo' : 'Editar Insumo' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="save()" [strong]="true" color="primary">
        Guardar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content">
  <form [formGroup]="insumoForm" class="product-form">
    <ion-item lines="none" class="dk-form-item">
      <ion-label position="stacked">Nombre del insumo *</ion-label>
      <ion-input formControlName="name" placeholder="Ej: Pan de hamburguesa (unidad)"></ion-input>
    </ion-item>
    <div class="dk-field-error" *ngIf="getError('name')">{{ getError('name') }}</div>

    <div class="form-row">
      <div class="form-col">
        <ion-item lines="none" class="dk-form-item">
          <ion-label position="stacked">Stock actual *</ion-label>
          <ion-input formControlName="stock" type="number" inputmode="numeric" placeholder="0"></ion-input>
        </ion-item>
        <div class="dk-field-error" *ngIf="getError('stock')">{{ getError('stock') }}</div>
      </div>

      <div class="form-col">
        <ion-item lines="none" class="dk-form-item">
          <ion-label position="stacked">Umbral de alerta *</ion-label>
          <ion-input formControlName="lowStockThreshold" type="number" inputmode="numeric" placeholder="5"></ion-input>
        </ion-item>
        <div class="dk-field-error" *ngIf="getError('lowStockThreshold')">{{ getError('lowStockThreshold') }}</div>
      </div>
    </div>
  </form>
</ion-content>
